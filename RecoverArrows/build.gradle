plugins {
    id 'java'
}

// Basic project metadata for the plugin jar.
group = 'com.hytsustudio'
version = '1.0.0'

java {
    toolchain {
        // Java version is configured in gradle.properties.
        languageVersion = JavaLanguageVersion.of(findProperty('javaVersion') ?: '17')
    }
}

dependencies {
    // Hytale server API provided by the server runtime.
    compileOnly files('libs/HytaleServer.jar')
}

// Produce a normal, unshaded plugin jar.
jar {
    archiveBaseName = 'RecoverArrows'
}
